name: Sync exact ZIP files

on:
  push:
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact files
        run: cat .sync/part* | base64 -d | tar -xzf -
      - name: Commit exact files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/contexts/AppContext.jsx src/hooks/useAsync.js src/utils/network-data.js src/pages/AddPage.jsx src/pages/DetailPage.jsx src/pages/LoginPage.jsx src/pages/NotFoundPage.jsx src/pages/NotesPage.jsx src/pages/RegisterPage.jsx src/styles.css
          git commit -m "Restore exact files from original ZIP"
          git push
